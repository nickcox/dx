name: push-pr-ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  core-tests:
    name: core-rust-tests-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Unix shell test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Run core tests
        run: cargo test --locked

  nix-flake-linux:
    name: nix-flake-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Nix flake check
        run: nix flake check

      - name: Nix package and app smoke
        # Phase 2 keeps Nix CI focused on Linux flake/build/run coverage.
        run: |
          nix build .#cdex
          nix run .#dx -- --help

  shell-lint:
    name: shell-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install shells and shellcheck
        run: sudo apt-get update && sudo apt-get install -y zsh fish shellcheck

      - name: Build dx
        run: cargo build --locked

      # The hook templates in src/hooks/templates cannot be linted directly:
      # placeholders such as __DX_BASH_MENU_FALLBACK_CASE__ sit inside `case` blocks, where a bare
      # word is a syntax error until substituted. Linting the generated scripts checks the actual artifacts.
      #
      # Extensions matter: e.g. PSScriptAnalyzer silently skips anything that is not .ps1/.psm1/.psd1
      - name: Generate every hook script
        run: |
          mkdir -p target/hooks
          extension() {
            case "$1" in
              bash) echo sh ;;
              zsh) echo zsh ;;
              fish) echo fish ;;
              pwsh) echo ps1 ;;
            esac
          }
          for shell in bash zsh fish pwsh; do
            for flags in "" "--command-not-found" "--menu" "--menu --command-not-found"; do
              suffix="$(echo "$flags" | tr -d ' -')"
              ./target/debug/dx init "$shell" $flags \
                > "target/hooks/$shell${suffix:+-$suffix}.$(extension "$shell")"
            done
          done
          ./target/debug/dx init pwsh --native-menu > target/hooks/pwsh-nativemenu.ps1

      # The checked-in goldens are linted too, so a blind `DX_UPDATE_GOLDENS=1`
      # regeneration cannot land a script that no longer parses.
      - name: shellcheck (bash)
        run: |
          for f in target/hooks/bash*.sh src/hooks/goldens/*.sh; do
            echo "== $f"; shellcheck -s bash -S error "$f"
          done

      - name: Parse-check bash, zsh and fish
        run: |
          for f in target/hooks/bash*.sh src/hooks/goldens/*.sh; do bash -n "$f"; done
          for f in target/hooks/zsh*.zsh src/hooks/goldens/*.zsh; do zsh -n "$f"; done
          for f in target/hooks/fish*.fish src/hooks/goldens/*.fish; do fish -n "$f"; done

      # Rules excluded as inapplicable to a generated shell hook.
      # Exclude list so that unanticipated errors still fail the build.
      - name: PSScriptAnalyzer (pwsh)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $excluded = @(
            'PSAvoidGlobalVars',                           # hooks need cross-invocation state
            'PSReviewUnusedParameter',                     # PowerShell mandates the completer signature
            'PSProvideCommentHelp',                        # internal hook functions
            'PSUseShouldProcessForStateChangingFunctions', # a cd wrapper does not want -WhatIf
            'PSAvoidUsingWriteHost',                       # deliberate init-time warning
            'PSAvoidUsingEmptyCatchBlock',                 # best-effort cleanup; a hook must not break the prompt
            'PSUseBOMForUnicodeEncodedFile'                # delivered via stdout to Invoke-Expression, never read from disk
          )
          # -Path takes one string, so analyse each root separately; -ErrorAction
          # Stop keeps a failed call from passing as "no findings".
          $found = @()
          foreach ($root in @('target/hooks', 'src/hooks/goldens')) {
            $found += @(Invoke-ScriptAnalyzer -Path $root -Severity Error, Warning `
              -ExcludeRule $excluded -ErrorAction Stop)
          }
          if ($found.Count) {
            $found | Format-Table RuleName, ScriptName, Line, Message -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer clean"

      - name: Parse-check pwsh
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(Get-ChildItem target/hooks/pwsh*.ps1) +
                            @(Get-ChildItem src/hooks/goldens/*.ps1)) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors) > $null
            if ($errors.Count) {
              Write-Host "== $($file.Name)"
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  shell-smoke-ubuntu:
    name: shell-smoke-${{ matrix.shell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh, fish, pwsh]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zsh/Fish
        if: matrix.shell == 'zsh' || matrix.shell == 'fish'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Build dx
        run: cargo build --locked

      - name: Run shell smoke
        run: |
          case "${{ matrix.shell }}" in
            bash)
              bash -lc 'eval "$(./target/debug/dx init bash --menu --command-not-found)"; cd . >/dev/null 2>&1; command -v up >/dev/null; command -v back >/dev/null; command -v forward >/dev/null; command -v cdf >/dev/null; command -v cdr >/dev/null; declare -F command_not_found_handle >/dev/null'
              ;;
            zsh)
              zsh -fc 'function compdef() { :; }; eval "$(./target/debug/dx init zsh --menu --command-not-found)"; cd . >/dev/null 2>&1; whence -w up >/dev/null; whence -w back >/dev/null; whence -w forward >/dev/null; whence -w cdf >/dev/null; whence -w cdr >/dev/null; whence -w command_not_found_handler >/dev/null'
              ;;
            fish)
              fish -c './target/debug/dx init fish --menu --command-not-found | source; cd . >/dev/null 2>/dev/null; functions -q up; and functions -q back; and functions -q forward; and functions -q cdf; and functions -q cdr; and functions -q fish_command_not_found'
              ;;
            pwsh)
              pwsh -NoProfile -Command 'Invoke-Expression ((& ./target/debug/dx init pwsh --menu --command-not-found | Out-String)); Set-Location .; Get-Command up -CommandType Alias | Out-Null; Get-Command back -CommandType Alias | Out-Null; Get-Command forward -CommandType Alias | Out-Null; Get-Command cdf -CommandType Alias | Out-Null; Get-Command cdr -CommandType Alias | Out-Null'
              ;;
          esac

  shell-smoke-pwsh:
    name: shell-smoke-pwsh
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build dx
        run: cargo build --locked

      - name: Run PowerShell smoke
        shell: pwsh
        run: |
          Invoke-Expression ((& .\target\debug\dx.exe init pwsh --menu --command-not-found | Out-String))
          cd .
          Get-Command up -CommandType Alias | Out-Null
          Get-Command back -CommandType Alias | Out-Null
          Get-Command forward -CommandType Alias | Out-Null
          Get-Command cdf -CommandType Alias | Out-Null
          Get-Command cdr -CommandType Alias | Out-Null
