[package]
name = "cdex"
version = "0.11.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dx"
path = "src/lib.rs"

[[bin]]
name = "dx"
path = "src/main.rs"

[profile.release]
# ~32% smaller binary; no measurable runtime change. No `panic = "abort"` as it prevents cleanup
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.6"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
dirs = "6"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml = "1.1.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["poll"] }

[[bench]]
name = "resolve_latency"
harness = false

[[bench]]
name = "menu_styling"
harness = false
